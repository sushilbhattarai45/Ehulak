name : Deploying to Production

on :
  push:
    branches:
      - main
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: deploying the whole app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.HOST_DO}}
          username: root
          key: ${{secrets.SSH_KEY_DO}}
          script: |
            source ~/.nvm/nvm.sh
            cd Ehulak
            git pull
            cd frontend
            npm install
            npm run build
            cd ../server
            npm install
            pm2 restart all



    

     
