name: Deploying to Production

on:
  push:
    branches:
      - main

jobs:
  Frontend_Deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: deploying the whole app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.OVH_HOST}}
          username: ubuntu
          key: ${{secrets.OVH_SECRET}}
          script: |
            source ~/.nvm/nvm.sh
            cd Ehulak
            git reset --hard 
            git pull
            cd frontend
            docker stop ehulak-frontend || true
            docker rm ehulak-frontend || true
            docker build --no-cache -t ehulak-frontend .
            docker run -d --name ehulak-frontend -p 127.0.0.1:3000:80 --restart unless-stopped ehulak-frontend

  Server_Deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: deploying the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.OVH_HOST}}
          username: ubuntu
          key: ${{secrets.OVH_SECRET}}

          script: |
            source ~/.nvm/nvm.sh
            cd Ehulak
            git pull
            cd server
            docker compose down
            docker compose build --no-cache
            docker compose up -d --force-recreate

  test:
    runs-on: ubuntu-latest
    needs: Server_Deployment
    steps:
      - name: Checking health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.OVH_HOST}}
          username: ubuntu
          key: ${{secrets.OVH_SECRET}}
          run: |
            curl -f http://127.0.0.1:3002 || exit 1
