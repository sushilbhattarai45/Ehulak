server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}